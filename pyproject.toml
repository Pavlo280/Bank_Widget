[tool.poetry]
name = "bank-widget"
version = "0.1.0"
description = "Bank widget for masking card and account numbers"
authors = ["Student"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.34.2"
python-dotenv = "^1.2.2"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.0.0"
black = "^24.0.0"
isort = "^5.13.0"
mypy = "^1.8.0"


[tool.poetry.group.dev.dependencies]
ruff = "^0.15.5"
pytest-cov = "^7.1.0"
autotyping = "^24.9.0"

[tool.black]
line-length = 119
exclude = ".git"

[tool.isort]
line_length = 119
force_single_line = true

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ["venv"]
mypy_path = "."

[tool.mypy.overrides]
module = "tests.*"
disallow_untyped_defs = false

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["F401"]